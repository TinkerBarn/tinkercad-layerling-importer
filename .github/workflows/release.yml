name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare a draft, publish its exact assets, or roll back hosting
        type: choice
        options: [prepare, publish, rollback]
        required: true
      tag:
        description: Version tag (for example v0.2.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-and-pages
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      publish: ${{ inputs.mode != 'prepare' }}
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve publication tag
        if: inputs.mode == 'publish'
        id: source
        run: python tools/release.py resolve "$TAG"
      - name: Check out exact release source
        if: inputs.mode == 'publish'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.commit }}
      - name: Prepare, verify or publish
        run: python tools/release.py "$MODE" "$TAG"
      - name: Upload exact browser files for deployment
        if: inputs.mode != 'prepare'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/site

  deploy:
    if: inputs.mode != 'prepare'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified release assets
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
