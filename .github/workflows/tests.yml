name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Converter regressions
        run: python tinkercad-import/convert.py --self-test
      - name: Exporter regressions
        run: node --test tinkercad-import/test_exporter.cjs
      - name: Build source distribution
        run: python tools/package_release.py
      - name: Whitespace
        run: git diff --check
