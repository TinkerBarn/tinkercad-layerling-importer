name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Converter regressions
        run: python tinkercad-import/convert.py --self-test
      - name: Exporter regressions
        run: node --test tinkercad-import/test_exporter.cjs
      - name: Browser converter regressions
        run: node --test tinkercad-import/test_browser_converter.cjs
      - name: Build bookmarklet page
        run: python tools/build_browser.py
      - name: Check generated page is current
        run: git diff --exit-code -- tinkercad-import/bookmarklet.html
      - name: Browser and Python parity
        run: python tools/check_browser_parity.py
      - name: Build source distribution
        run: python tools/package_release.py
      - name: Verify source and browser bundles
        run: python tools/check_release.py
      - name: Release regressions
        run: python -m unittest discover -s tools -p "test_release.py"
      - name: Whitespace
        run: git diff --check
